<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ls ~/blogs — Srijan Tangnami Magar</title>
    <meta name="description" content="Blog posts by Srijan Tangnami Magar on cloud, networking, and automation." />
    <link rel="icon" type="image/svg+xml" href="gemini-svg.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script>document.documentElement.classList.add('js');</script>
  </head>
  <body>
    <div class="shell">

      <div class="statusbar" role="banner">
        <span class="host"><b>srijan</b><i>@</i><b>infra</b><i>:</i> <span class="path">~/blogs</span></span>
        <span class="center">/dev/console · <span data-metric="uptime">0h 00m 00s</span></span>
        <span class="right">
          <span><span class="led ok"></span>ONLINE</span>
          <span class="clock" data-clock="utc">00:00:00 UTC</span>
        </span>
      </div>

      <div class="window post-hero">
        <div class="win-title">
          <span class="dots"><span class="r"></span><span class="y"></span><span class="g"></span></span>
          <span class="tpath"><b>srijan</b>@infra: ~/blogs</span>
          <span class="tstatus">ARCHIVE</span>
        </div>
        <div class="win-body">
          <div class="term">
            <p class="prompt out">ls -la ./blogs</p>
            <p class="out dim">total posts from the infrastructure front line</p>
            <p class="out okk">runbooks · notes · field reports</p>
            <p class="prompt cursor">cat &lt;post&gt;</p>
          </div>
        </div>
      </div>

      <div class="cmds" style="margin: 20px 0 30px;">
        <a class="cmd" href="index.html">cd ~</a>
      </div>

      <section class="screen">
        <div class="sc-title"><span class="marker">●</span><span class="file">~/blogs — directory listing</span></div>
        <div class="sc-body">
          <div id="blog-list" class="blog-grid"></div>
        </div>
      </section>

      <footer>
        <div class="eof">
          <span>-- EOF --</span>
          <span><span class="led ok"></span> archive served</span>
        </div>
      </footer>

    </div>

    <script src="console.js"></script>
    <script src="blogs.js"></script>
  </body>
</html>
